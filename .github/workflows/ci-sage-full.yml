name: Sage CI (full matrix)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DIST_PREREQ: libcdd-dev
  SPKG:        singular
  REMOVE_PATCHES: "*"

jobs:

  dist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ${{ env.SPKG }}
        uses: actions/checkout@v4
        with:
          path: build/pkgs/${{ env.SPKG }}/src
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y $DIST_PREREQ
      - name: Run make dist, prepare upstream artifact
        run: |
          (cd build/pkgs/${{ env.SPKG }}/src && (./autogen.sh && ./configure && make dist) ) \
          && mkdir -p upstream && cp build/pkgs/${{ env.SPKG }}/src/*.tar.gz upstream/${{ env.SPKG }}-git.tar.gz \
          && echo "sage-package create ${{ env.SPKG }} --version git --tarball ${{ env.SPKG }}-git.tar.gz --type=optional" > upstream/update-pkgs.sh \
          && if [ -n "${{ env.REMOVE_PATCHES }}" ]; then echo "(cd ../build/pkgs/${{ env.SPKG }}/patches && rm -f ${{ env.REMOVE_PATCHES }}; :)" >> upstream/update-pkgs.sh; fi \
          && echo 'echo ntl flint readline mpfr cddlib 4ti2 info > ../build/pkgs/singular/dependencies' >> upstream/update-pkgs.sh \
          && ls -l upstream/
      - uses: actions/upload-artifact@v4
        with:
          path: upstream
          name: upstream

  docker-full:
    uses: passagemath/passagemath/.github/workflows/docker.yml@main
    with:
      max_parallel: 12
      free_disk_space: true
      extra_sage_packages: "info ncurses readline"
      targets_pre: SAGE_CHECK=no singular-build-deps
      targets: GITHUB_ACTIONS=1 SAGE_CHECK=no SAGE_CHECK_PACKAGES=singular V=1 singular
      targets_optional: SAGE_CHECK=no SAGE_CHECK_pysingular=warn pysingular
      timeout: 8000
      sage_repo: passagemath/passagemath
      sage_ref: main
      upstream_artifact: upstream
      docker_targets: "with-targets"
      docker_push_repository: ghcr.io/${{ github.repository }}/singular_
    needs: [dist]

  macos-full:
    uses: passagemath/passagemath/.github/workflows/macos.yml@main
    with:
      # Homebrew's ecl formula no longer supports macOS 14. Keep macOS 14
      # conda-forge coverage, but run Homebrew coverage on macOS 15+.
      osversion_xcodeversion_toxenv_tuples: >-
        [
          ["15-intel", "", "homebrew-macos-usrlocal-minimal"],
          ["15-intel", "", "homebrew-macos-usrlocal-standard"],
          ["15-intel", "", "conda-forge-macos-minimal"],
          ["15-intel", "", "conda-forge-macos-standard"],
          ["14", "", "conda-forge-macos-minimal"],
          ["14", "", "conda-forge-macos-standard"],
          ["15", "", "homebrew-macos-opthomebrew-minimal"],
          ["15", "", "homebrew-macos-opthomebrew-standard"],
          ["15", "", "conda-forge-macos-minimal"],
          ["15", "", "conda-forge-macos-standard"],
          ["26", "", "homebrew-macos-opthomebrew-minimal"],
          ["26", "", "homebrew-macos-opthomebrew-standard"],
          ["26", "", "conda-forge-macos-minimal"],
          ["26", "", "conda-forge-macos-standard"]
        ]
      max_parallel: 4
      targets_pre: SAGE_CHECK=no singular-build-deps
      targets: SAGE_CHECK=no SAGE_CHECK_PACKAGES=singular V=1 singular
      targets_optional: SAGE_CHECK=no SAGE_CHECK_pysingular=warn pysingular
      timeout: 8000
      sage_repo: passagemath/passagemath
      sage_ref: main
      upstream_artifact: upstream
    needs: [dist]
