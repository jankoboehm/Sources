name: CI with Oscar

on:
  workflow_dispatch:
    inputs:
      pkgtest_subset:
        description: Oscar test subset to run via Pkg.test (optional)
        type: choice
        options:
          - none
          - short
          - long
          - both
        default: none
  pull_request:
  push:
    branches:
      - 'master'
      - 'spielwiese'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref_name != github.event.repository.default_branch || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  OSCAR_SELECTED_TESTS: 'Rings/mpoly.jl Rings/MPolyQuo.jl Rings/mpoly-affine-algebras.jl Rings/binomial-ideals.jl Rings/oscar_singular.jl Rings/orderings.jl Modules/ModulesGraded.jl Modules/UngradedModules.jl Modules/homological-algebra.jl'
  JULIA_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  test:
    name: Oscar ${{ matrix.oscar-version }} - Singular.jl ${{ matrix.singularjl-version }} - Singular dev
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: ${{ matrix.oscar-version == 'master' || matrix.singularjl-version == 'master' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - oscar-version: 'latest-release'
            singularjl-version: 'latest-release'
          - oscar-version: 'latest-release'
            singularjl-version: 'master'
          - oscar-version: 'master'
            singularjl-version: 'master'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Install Singular.jl + Oscar
        shell: julia --project=override --color=yes {0}
        env:
          OSCAR_CI_EXPERIMENTAL: ${{ matrix.oscar-version == 'master' || matrix.singularjl-version == 'master' }}
        run: |
          using Pkg

          function set_github_env(name, value)
            open(ENV["GITHUB_ENV"], "a") do io
              println(io, name, "=", value)
            end
          end

          experimental = lowercase(get(ENV, "OSCAR_CI_EXPERIMENTAL", "false")) == "true"

          try
            if "${{ matrix.singularjl-version }}" == "latest-release"
              Pkg.add("Singular")
            else
              Pkg.add(; name="Singular", rev="${{ matrix.singularjl-version }}")
            end
            if "${{ matrix.oscar-version }}" == "latest-release"
              Pkg.add("Oscar")
            else
              Pkg.add(; name="Oscar", rev="${{ matrix.oscar-version }}")
            end
            Pkg.add("Documenter")
            Pkg.instantiate()
            path = dirname(dirname(Base.find_package("Singular")))
            set_github_env("SINGULARJL_PATH", path)
            set_github_env("OSCAR_CI_SKIP_ROW", "false")
          catch err
            if experimental
              @warn "Optional Oscar/Singular.jl matrix row cannot be resolved; skipping this row" exception=(err, catch_backtrace())
              set_github_env("OSCAR_CI_SKIP_ROW", "true")
              exit(0)
            else
              rethrow()
            end
          end

      - name: Install build tools
        if: env.OSCAR_CI_SKIP_ROW != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config build-essential cmake

      - name: Prepare Singular source
        if: env.OSCAR_CI_SKIP_ROW != 'true'
        run: |
          rm -rf /tmp/SINGULARROOT
          mkdir -p /tmp/SINGULARROOT
          cp -a "$GITHUB_WORKSPACE/." /tmp/SINGULARROOT
          cd /tmp/SINGULARROOT
          ./autogen.sh

      - name: Build Singular override prefix
        if: env.OSCAR_CI_SKIP_ROW != 'true'
        run: |
          rm -rf /tmp/singular_jll_override
          cp "$SINGULARJL_PATH/etc/setup_override_dir.jl" /tmp/setup_override_dir.jl
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/setup_override_dir.jl')
          text = path.read_text()
          old = 'artifact_paths = collect_artifact_paths(deps)'
          new = 'artifact_paths = collect_artifact_paths(deps; project_dir=dirname(Base.active_project()))'
          if old not in text:
              raise SystemExit('setup_override_dir.jl changed: expected collect_artifact_paths(deps) call not found')
          path.write_text(text.replace(old, new, 1))
          PY
          julia --project=override --color=yes /tmp/setup_override_dir.jl /tmp/SINGULARROOT /tmp/singular_jll_override --yes

      - name: Run selected Oscar upstream tests (with overridden Singular_jll)
        if: env.OSCAR_CI_SKIP_ROW != 'true'
        run: |
          julia --project=override $SINGULARJL_PATH/etc/run_with_override.jl /tmp/singular_jll_override --startup-file=no --color=yes .github/oscar/run_selected_tests.jl

      - name: Run Oscar test suite via Pkg.test (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pkgtest_subset != 'none' && matrix.oscar-version == 'latest-release' && matrix.singularjl-version == 'latest-release' && env.OSCAR_CI_SKIP_ROW != 'true' }}
        run: |
          subset='${{ github.event.inputs.pkgtest_subset }}'
          if [ "$subset" = "both" ]; then
            subsets="short long"
          else
            subsets="$subset"
          fi
          for s in $subsets; do
            echo "Running Oscar tests via Pkg.test with OSCAR_TEST_SUBSET=$s"
            OSCAR_TEST_SUBSET="$s" julia --project=override $SINGULARJL_PATH/etc/run_with_override.jl /tmp/singular_jll_override --startup-file=no --color=yes -e 'import Pkg; Pkg.test("Oscar")'
          done
