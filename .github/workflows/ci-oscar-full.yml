name: CI with Oscar (full test suite)

run-name: >-
  ${{ github.event.inputs.pr_number != '' && format('PR #{0} - Oscar full ({1})', github.event.inputs.pr_number, github.event.inputs.subset) || format('{0} - Oscar full ({1})', github.ref_name, github.event.inputs.subset) }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test instead of the selected branch (optional)'
        required: false
        type: string
      subset:
        description: Oscar test subset to run
        type: choice
        options:
          - short
          - long
          - both
        default: short

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.pr_number != '' && format('pr-{0}', github.event.inputs.pr_number) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JULIA_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  SINGULAR_CHECKOUT_REF: ${{ github.event.inputs.pr_number != '' && format('refs/pull/{0}/merge', github.event.inputs.pr_number) || github.ref }}

jobs:
  test:
    name: "${{ github.event.inputs.pr_number != '' && format('PR #{0} / ', github.event.inputs.pr_number) || '' }}Oscar ${{ matrix.oscar-version }} - Singular.jl ${{ matrix.singularjl-version }} - Singular dev (${{ matrix.oscar-subset }})"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    continue-on-error: ${{ matrix.oscar-version == 'master' || matrix.singularjl-version == 'master' }}
    strategy:
      fail-fast: false
      matrix:
        oscar-version: ['latest-release', 'master']
        singularjl-version: ['latest-release', 'master']
        oscar-subset: ${{ fromJSON(github.event.inputs.subset == 'both' && '["short","long"]' || format('["{0}"]', github.event.inputs.subset)) }}
        exclude:
          - oscar-version: 'master'
            singularjl-version: 'latest-release'
    env:
      OSCAR_TEST_SUBSET: ${{ matrix.oscar-subset }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SINGULAR_CHECKOUT_REF }}

      - name: Show tested ref
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          SELECTED_REF: ${{ github.ref_name }}
          OSCAR_SUBSET_INPUT: ${{ github.event.inputs.subset }}
        run: |
          echo "Selected workflow ref: $SELECTED_REF"
          echo "Testing ref: $SINGULAR_CHECKOUT_REF"
          echo "Oscar subset input: $OSCAR_SUBSET_INPUT"
          if [ -n "$PR_NUMBER" ]; then
            echo "Testing PR #$PR_NUMBER via merge ref"
          fi

          {
            echo "### Full Oscar matrix target"
            echo
            if [ -n "$PR_NUMBER" ]; then
              echo "- PR: #$PR_NUMBER"
              echo "- Selected workflow ref: $SELECTED_REF"
              echo "- Checkout ref: $SINGULAR_CHECKOUT_REF"
            else
              echo "- Selected workflow ref: $SELECTED_REF"
              echo "- Checkout ref: $SINGULAR_CHECKOUT_REF"
            fi
            echo "- Oscar subset input: $OSCAR_SUBSET_INPUT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Install Singular.jl + Oscar
        shell: julia --project=override --color=yes {0}
        env:
          OSCAR_CI_EXPERIMENTAL: ${{ matrix.oscar-version == 'master' || matrix.singularjl-version == 'master' }}
        run: |
          using Pkg

          function set_github_env(name, value)
            open(ENV["GITHUB_ENV"], "a") do io
              println(io, name, "=", value)
            end
          end

          experimental = lowercase(get(ENV, "OSCAR_CI_EXPERIMENTAL", "false")) == "true"

          try
            if "${{ matrix.singularjl-version }}" == "latest-release"
              Pkg.add("Singular")
            else
              Pkg.add(; name="Singular", rev="${{ matrix.singularjl-version }}")
            end
            if "${{ matrix.oscar-version }}" == "latest-release"
              Pkg.add("Oscar")
            else
              Pkg.add(; name="Oscar", rev="${{ matrix.oscar-version }}")
            end
            Pkg.add("Documenter")
            Pkg.instantiate()
            path = dirname(dirname(Base.find_package("Singular")))
            set_github_env("SINGULARJL_PATH", path)
            set_github_env("OSCAR_CI_SKIP_ROW", "false")
          catch err
            if experimental
              @warn "Optional Oscar/Singular.jl matrix row cannot be resolved; skipping this row" exception=(err, catch_backtrace())
              set_github_env("OSCAR_CI_SKIP_ROW", "true")
              exit(0)
            else
              rethrow()
            end
          end

      - name: "Optional row skipped: unresolved Julia package set"
        if: env.OSCAR_CI_SKIP_ROW == 'true'
        run: |
          {
            echo "### Optional Oscar/Singular.jl matrix row skipped"
            echo
            echo "This row uses at least one \`master\` Julia package. Julia could not currently resolve a compatible Oscar/Singular.jl/Nemo dependency set, so the Singular override was not built and no Oscar tests were run for this optional row."
            echo
            echo "The release/release row remains the required integration check for this Singular checkout."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install build tools
        if: env.OSCAR_CI_SKIP_ROW != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config build-essential cmake

      - name: Prepare Singular source
        if: env.OSCAR_CI_SKIP_ROW != 'true'
        run: |
          rm -rf /tmp/SINGULARROOT
          mkdir -p /tmp/SINGULARROOT
          cp -a "$GITHUB_WORKSPACE/." /tmp/SINGULARROOT
          cd /tmp/SINGULARROOT
          ./autogen.sh

      - name: Build Singular override prefix
        if: env.OSCAR_CI_SKIP_ROW != 'true'
        run: |
          rm -rf /tmp/singular_jll_override
          rm -f /tmp/setup_override_dir.jl
          install -m 0644 "$SINGULARJL_PATH/etc/setup_override_dir.jl" /tmp/setup_override_dir.jl
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/setup_override_dir.jl')
          text = path.read_text()
          old = 'artifact_paths = collect_artifact_paths(deps)'
          replacement = r"""
          function resolved_jll_specs_from_active_manifest(names)
              ctx = Pkg.Types.Context()
              specs = Pkg.PackageSpec[]

              for name in names
                  found_uuid = nothing
                  found_entry = nothing

                  for (uuid, entry) in ctx.env.manifest.deps
                      if entry.name == name
                          found_uuid = uuid
                          found_entry = entry
                          break
                      end
                  end

                  if found_entry === nothing
                      push!(specs, Pkg.PackageSpec(; name = name))
                  else
                      push!(specs, Pkg.PackageSpec(;
                          name = found_entry.name,
                          uuid = found_uuid,
                          version = found_entry.version,
                          tree_hash = found_entry.tree_hash,
                          path = found_entry.path,
                          repo = found_entry.repo,
                      ))
                  end
              end

              return specs
          end

          deps = resolved_jll_specs_from_active_manifest(deps)
          artifact_paths = collect_artifact_paths(deps)
          """
          if old not in text:
              raise SystemExit('setup_override_dir.jl changed: expected collect_artifact_paths(deps) call not found')
          path.write_text(text.replace(old, replacement, 1))
          PY
          julia --project=override --color=yes /tmp/setup_override_dir.jl /tmp/SINGULARROOT /tmp/singular_jll_override --yes

      - name: "Run Oscar test suite (subset: ${{ matrix.oscar-subset }})"
        if: env.OSCAR_CI_SKIP_ROW != 'true'
        run: |
          julia --project=override $SINGULARJL_PATH/etc/run_with_override.jl /tmp/singular_jll_override --startup-file=no --color=yes -e 'import Pkg; Pkg.test("Oscar")'
